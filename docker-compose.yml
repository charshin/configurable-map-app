# Local Postgres for the API. Start with `pnpm db:up`.
# Host port defaults to 5433 so it doesn't clash with a locally installed Postgres on 5432.

# Fixed project name, so the container and volume names don't depend on the
# folder the repo is cloned into.
name: configurable-map-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: confmap
      POSTGRES_PASSWORD: confmap
      POSTGRES_DB: confmap
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confmap -d confmap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
