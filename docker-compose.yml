# Local Postgres for the API. Start with `pnpm db:up`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: confmap
      POSTGRES_PASSWORD: confmap
      POSTGRES_DB: confmap
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confmap -d confmap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
